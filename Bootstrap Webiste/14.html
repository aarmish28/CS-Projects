   <style>
   .btn{
  border-radius: 8px;

      <div class="me-0 mx-3 mt-4">
        <div class="btn-group">
          <button type="button" class="btn text-white" style="background-color:rgba(65,143,59,255);"><i class="fa fa-check" aria-hidden="true"></i></button>

        <div class="btn-group">
        <button type="button" class="btn text-white" style="background-color:rgba(180,46,59,255);"><i class="fa fa-times" aria-hidden="true"></i></button>
      <button type="button" class="btn text-white " style="background-color: rgba(220,53,70,255);">Cancel</button></div>
      <div class="btn-group">
        <button type="button" class="btn text-dark" style="background-color:rgba(210,162,11,255);"><i class="fa fa-bookmark" aria-hidden="true"></i></button>

      </div>

      <div class="me-0 mx-3 mt-4">

          <button type="button" class="btn text-dark" style="background-color:rgba(217,217,217,255);"><i class="fa fa-chevron-left" aria-hidden="true"></i></button>

          <button type="button" class="btn text-dark" style="background-color:rgba(217,217,217,255);"><i class="fa fa-chevron-right" aria-hidden="true"></i></button>

      <div class="btn-group">
        <button type="button" class="btn text-white" style="background-color:rgba(65,143,59,255);"><i class="fa fa-thumbs-up" aria-hidden="true"></i></button>

      </div>
      <div class="me-0 mx-3 mt-4">
