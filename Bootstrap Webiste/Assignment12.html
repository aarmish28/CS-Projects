    <div class="container-fluid">
        <h1>Web Design and Development Class Spring 2023 Registration Form</h1>
        <div class="mb-3 mt-3">
        <form action="">
            <label for="email">Email:</label>
                <input  for="email"  class="form-control" id="email" placeholder="Enter Email" name="email"><br>
            <label for="pwd">Password</label>
            <input for="pwd" class="form-control" id="pwd" placeholder="Enter Password" name="password"><br>
            <div class="form-check">
                <label class="form-check-label"></label>
                <input class="form-check-input" type="checkbox" name="Remember">Remember Me</div><br>
                
                <button class="btn btn-primary" type="submit">Submit</button>
        </form></div>
