<!doctype html>
<html lang="en">
  <head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <title>University  Employee Management System</title>
    <style>
        body {
           background-image: url(https://i.pinimg.com/originals/c5/9a/d2/c59ad2bd4ad2fbacd04017debc679ddb.gif);
           background-repeat: no-repeat;
           background-attachment: fixed;
           background-size: cover;
       }
       .data{
        position: relative;
        display: flex;
        justify-content: center;
        align-items: center;
       }
       input{
        border-radius: 10px;
        padding: 10px;
        margin-top: 10px;
        width: 40%;
        border: none;
        outline: none;
       }
       input:focus{
        border: #ff0000;
        transform: scale(1.02);
        box-shadow: 0px 0px 5px rgba(0, 0, 0, 0.2);
       }
       ::placeholder{
        padding-left: 20px;
       }
       input:focus + .placeholder
      {
        top: -10px;
        color: #04AA6D;
        background-color: #fff;
      }
      label{
        display: flex;
        justify-content: flex-start;
        align-items: center;
        width: 150px;
        font-weight: bolder;
        font-size: 20px;
        color: black;
        padding: 10px 10px 0px 4px;
      }
    form{
      display: flex;
      justify-content: center;
      flex-direction: column;
    
    }
    button{
      width: 200px;
      margin: 10px auto;
    }

      
       </style>
  </head>
  <body>
    <div class="container mt-3 text-center text-white">
        <h1 style="text-shadow: 0 0 8px rgb(255, 230, 0) , 0 0 4px #ffe603;"><i class="bi bi-person-fill-add"></i> Adding University Employee Management System</h1>
        <hr>
        <form action="/add_emp" method="post">

            {% csrf_token %}
        
            <div class="data"><label for="first_name" class="form-label text-warning" style="text-shadow: 0 0 2px rgb(74, 74, 72) , 0 0 4px #ffffff;"><b>First Name</b></label><br>
          <input type="text" id="first_name"name="first_name" placeholder="Enter your First Name" value="{{first_name}}"><br></div>
          
          <div class="data"><label for="last_name" class="form-label text-warning" style="text-shadow: 0 0 2px rgb(74, 74, 72) , 0 0 4px #ffffff;"><b>Last Name</b></label><br>
          <input type="text" id="last_name" name="last_name" placeholder="Enter your Last Name" value="{{last_name}}"><br></div>
          
          <div class="data"><label for="salary" class="form-label text-warning" style="text-shadow: 0 0 2px rgb(74, 74, 72) , 0 0 4px #ffffff;" ><b>Salary</b></label><br>
          <input type="text" id="salary" name="salary" placeholder="Enter your  Salary" value="{{salary}}"><br></div>

          <div class="data"><label for="dept" class="form-label  text-warning" style="text-shadow: 0 0 2px rgb(74, 74, 72) , 0 0 4px #ffffff;"><b>Department</b></label><br>
          <input type="text" id="dept" name="dept" placeholder="Enter your Department" value="{{dept}}"><br></div>

          <div class="data"><label for="role" class="form-label text-warning" style="text-shadow: 0 0 2px rgb(74, 74, 72) , 0 0 4px #ffffff;"><b>Role</b></label><br>
          <input type="text" id="role" name="role" placeholder="Enter your Role" value="{{role}}"><br></div>

          <div class="data"><label for="bonus" class="form-label text-warning" style="text-shadow: 0 0 2px rgb(74, 74, 72) , 0 0 4px #ffffff;"><b>Bonus</b></label><br>
          <input type="number" id="bonus" name="bonus" placeholder="Enter your Bonus" value="{{bonus}}"><br></div>
          
          <div class="data"><label for="phone" class="form-label text-warning" style="text-shadow: 0 0 2px rgb(74, 74, 72) , 0 0 4px #ffffff;"><b>Phone No</b></label><br>
          <input type="number" id="phone" name="phone" placeholder="Enter your Phone Number" value="{{phone}}"><br></div>
          
          <br> 
          
          <button type="submit" class="btn btn-danger"   style="text-shadow: 0 0 2px rgb(222, 222, 28) , 0 0 4px #ffffff;box-shadow: 0 0 8px rgb(253, 241, 0) , 0 0 4px #fff703;"><i class="bi bi-person-fill-add"></i> Adding University Employee</button>

    </form>

    </div>
    <!-- Optional JavaScript; choose one of the two! -->

    <!-- Option 1: Bootstrap Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>

    <!-- Option 2: Separate Popper and Bootstrap JS -->
    <!--
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js" integrity="sha384-IQsoLXl5PILFhosVNubq5LC7Qb9DXgDA9i+tQ8Zj3iwWAwPtgFTxbJ8NT4GN1R8p" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.min.js" integrity="sha384-cVKIPhGWiC2Al4u+LWgxfKTRIcfu0JTxR+EQDz/bgldoEyl4H0zUF0QKbrJ0EcQF" crossorigin="anonymous"></script>
    -->
  </body>
</html>
