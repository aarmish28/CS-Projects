{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <title></title>
    <style>
      body {
         background-image: url("{% static '5.jpg' %}");
         background-repeat: no-repeat;
         background-attachment: fixed;
         background-size: cover;
     }
     .data{
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
     }
     input{
      border-radius: 10px;
      padding: 10px;
      margin-top: 15px;
      width: 35%;
      border: none;
      outline: none;
     }
     input:focus{
      border: #ccc;
      transform: scale(1.02);
      box-shadow: 0px 0px 5px rgba(0, 0, 0, 0.2);
     }
     ::placeholder{
      padding-left: 20px;
     }
     input:focus + .placeholder
    {
      top: -10px;
      color: #04AA6D;
      background-color: #fff;
    }
    label{
      display: flex;
      justify-content: flex-start;
      align-items: center;
      width: 150px;
      font-weight: bolder;
      font-size: 20px;
      color: black;
      padding: 10px 10px 0px 4px;
    }
  form{
    display: flex;
    justify-content: right;
    flex-direction: column;
    margin-top: 50px;
    box-sizing: border-box;
    padding: 20px;
  
  }
  button{
    width: 230px;
    height: 40px;
    margin: 10px auto;
   
  }

     </style>
  </head>
  
<body>
    <div class="container mt-4 text-center" style="text-shadow: 0 0 8px rgb(0, 255, 140) , 0 0 4px #0bab68; font-size: 23px; color: #ffffff;"><h1 style="background-image: linear-gradient(#1b31f5be 0%,rgba(47, 65, 184, 0.424));height: 58px;"><i class="bi bi-currency-dollar"></i> University Employees Expenses</h1>
  

        <hr>
        <form action="/employeeexpenses" method="post"  class="form-container">
          {% csrf_token %}
          <div class="data"><label for="employee" style="text-shadow: 0 0 8px rgb(0, 255, 140) , 0 0 4px #0bab68; font-size: 23px; color: #ffffff;">Name:</label>
        <input type="text" id="employee" name="name" value="{{name}}" required><br> <br></div>
        
  
      
        <div class="data"><label for="description" class="text"style="text-shadow: 0 0 8px rgb(0, 255, 140) , 0 0 4px #0bab68; font-size: 23px; color: #ffffff;"> <b>Description: </b></label> <br>
        <input id="description" name="description" value="{{description}}" placeholder="Enter Your Description" type="text" style="height: 100px;"><br></div>
  
  
      
    
        <div class="data"><label for="amount" class="text" style="text-shadow: 0 0 8px rgb(0, 255, 140) , 0 0 4px #0bab68; font-size: 23px; color: #ffffff;"><b>Amount: </b></label> <br>
        <input type="number" id="amount" name="amount" value="{{amount}}"> <br></div>
  
  
        <div class="data"><label for="date" class="text" style="text-shadow: 0 0 8px rgb(0, 255, 140) , 0 0 4px #0bab68; font-size: 23px; color: #ffffff;"><b>Date: </b></label> <br>
        <input type="datetime-local" id="date" name="date" value="{{date}}"> <br></div>
    
        
       
    
       
        <hr>
      <button type="submit" class="btn " style="box-shadow: 0 0 8px rgb(21, 0, 255) , 0 0 4px #0bab68; color: #02027e;background-image: linear-gradient(#b8e2cd 0%, #7fedafdf);"><i class="bi bi-currency-dollar"></i>  Add Expenses Now</button>
    </form>
          </div>
        </body>
        </html>
