<!doctype html>
<html lang="en">
  <head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <title></title>
    <style>
      body {
         background-image: url(https://storage.googleapis.com/proudcity/elgl/uploads/2019/11/AdobeStock_177738709.jpeg);
         background-repeat: no-repeat;
         background-attachment: fixed;
         background-size: cover;
     }
     .data{
      position: relative;
      display: flex;
      justify-content: right;
      align-items: right;
     }
     input{
      border-radius: 10px;
      padding: 10px;
      margin-top: 15px;
      width: 35%;
      border: none;
      outline: none;
     }
     input:focus{
      border: #ccc;
      transform: scale(1.02);
      box-shadow: 0px 0px 5px rgba(0, 0, 0, 0.2);
     }
     ::placeholder{
      padding-left: 20px;
     }
     input:focus + .placeholder
    {
      top: -10px;
      color: #04AA6D;
      background-color: #fff;
    }
    label{
      display: flex;
      justify-content: flex-start;
      align-items: center;
      width: 150px;
      font-weight: bolder;
      font-size: 20px;
      color: black;
      padding: 10px 10px 0px 4px;
    }
  form{
    display: flex;
    justify-content: right;
    flex-direction: column;
    margin-top: 50px;
    box-sizing: border-box;
    padding: 20px;
  
  }
  button{
    width: 230px;
    height: 40px;
    margin: 10px auto;
    margin-right: 100px;
   
  }

     </style>
  </head>
  
<body>
    <div class="container mt-3 text-center" style="color: #079258"  ><h1 class="text" style="box-shadow: 0 0 8px rgb(1, 173, 99) , 0 0 4px #00ff95; color: #00005c;background-image: linear-gradient(#b9e7d0 0%, #9bf9c4df);height: 55px;"><i class="bi bi-chat-right-text-fill"></i>  Feedback Form</h1>
  

        <hr>
        <form action="/employeefeedback" method="post"  class="form-container">
          {% csrf_token %}
          <div class="data"><label for="name" class="text" style="text-shadow: 0 0 8px rgb(219, 255, 239) , 0 0 4px #80c6ad; font-size: 26px; color: #007267;"><b>Name:</b></label> <br>
        <input type="text" id="first_name" name="name"  value="{{name}}"> <br></div>
        
        <div class="data"><label for="email" class="text" style="text-shadow: 0 0 8px rgb(219, 255, 239) , 0 0 4px #80c6ad; font-size: 26px; color: #007267;"><b>Email:</b></label> <br>
            <input type="text" id="email" name="email" value="{{email}}"> <br></div>
      
        <div class="data"><label for="content" class="text" style="text-shadow: 0 0 8px rgb(219, 255, 239) , 0 0 4px #80c6ad; font-size: 26px; color: #007267;"> <b>Content: </b></label> <br>
        <input id="content" name="content" value="{{content}}"  type="text" style="height: 130px;"><br></div>
  

        <hr>
      <button type="submit" class="btn " style="box-shadow: 0 0 8px rgb(1, 173, 99) , 0 0 4px #00ff95; color: #00005c;background-image: linear-gradient(#b9e7d0 0%, #9bf9c4df);"><i class="bi bi-chat-right-text-fill"></i>  Submit</button>
    </form>
          </div>
        </body>
        </html>
