<!doctype html>
<html lang="en">

<head>
  <!-- Required meta tags -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
  <title></title>
  <style>
    body {
      background-image: url(https://getpaidstock.com/tmp/[GetPaidStock.com]-648b78b408f0f.jpg);
      background-repeat: no-repeat;
      background-attachment: fixed;
      background-size: cover;
    }

    .data {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    input {
      border-radius: 10px;
      padding: 10px;
      margin-top: 15px;
      width: 35%;
      border: none;
      outline: none;
    }

    input:focus {
      border: #ccc;
      transform: scale(1.02);
      box-shadow: 0px 0px 5px rgba(0, 0, 0, 0.2);
    }

    ::placeholder {
      padding-left: 20px;
    }

    input:focus+.placeholder {
      top: -10px;
      color: #04AA6D;
      background-color: #fff;
    }

    label {
      display: flex;
      justify-content: flex-start;
      align-items: center;
      width: 150px;
      font-weight: bolder;
      font-size: 20px;
      color: black;
      padding: 10px 10px 0px 0px;
    }

    form {
      display: flex;
      justify-content: right;
      flex-direction: column;
      margin-top: 50px;
      box-sizing: border-box;
      padding: 20px;

    }

    button {
      width: 230px;
      height: 40px;
      margin: 10px auto;

    }
  </style>
</head>
<div class="container mt-3 text-center" style="color: #0059ff">
  <h1
    style="box-shadow: 0 0 8px rgb(0, 81, 255) , 0 0 4px #0062ff; color: #052034;background-image: linear-gradient(#7d99e4 0%, #5b76b8df);height: 55px;">
    <i class="bi bi-wallet-fill"></i> University Employee Payroll </h1>


  <hr>
  <form action="/employeepayroll" method="post" class="form-container">
    {% csrf_token %}
    <div class=data><label for="name" class="text" style="text-shadow: 0 0 8px rgb(172, 177, 222) , 0 0 4px #696d7d;color: #021848;"><b>Name:</b></label> <br>
      <input type="text" id="first_name" name="name" placeholder="Enter your First name" value="{{name}}"> <br>
    </div>

    <div class=data><label for="start_time" class="text" style="text-shadow: 0 0 8px rgb(172, 177, 222) , 0 0 4px #696d7d;color: #021848;"><b>Start_Time:</b></label> <br>
      <input type="datetime-local" id="start-time" name="start_time" value="{{start_time}}"> <br>
    </div>

    <div class=data><label for="end_time" class="text" style="text-shadow: 0 0 8px rgb(172, 177, 222) , 0 0 4px #696d7d;color: #021848;"><b>End_Time:</b></label> <br>
      <input type="datetime-local" id="end_time" name="end_time" value="{{end_time}}"> <br>
    </div>

    <div class=data><label for="basic_pay" class="text" style="text-shadow: 0 0 8px rgb(172, 177, 222) , 0 0 4px #696d7d;color: #021848;"><b>Basic Pay:</b></label> <br>
      <input type="number" id="basic_pay" name="basic_pay" placeholder="Enter your Basic Pay" value="{{basic_pay}}">
      <br>
    </div>

    <div class=data><label for="overtime_pay" class="text" style="text-shadow: 0 0 8px rgb(172, 177, 222) , 0 0 4px #696d7d;color: #021848;"><b>Overtime Pay:</b></label> <br>
      <input type="number" id="overtime_pay" name="overtime_pay" placeholder="enter your overtime pay"
        value="{{overtime_pay}}"> <br>
    </div>

    <div class=data><label for="tax_deducted" class="text" style="text-shadow: 0 0 8px rgb(172, 177, 222) , 0 0 4px #696d7d;color: #021848;"><b>Tax_Deducted:</b></label> <br>
      <input type="number" id="tax_deducted" name="tax_deducted" placeholder="Enter Deducted Tax"
        value="{{tax_deducted}}"> <br>
    </div>


    <div class=data><label for="net_pay" class="text" style="text-shadow: 0 0 8px rgb(172, 177, 222) , 0 0 4px #696d7d;color: #021848;"><b> Net Pay:</b></label> <br>
      <input type="number" id="net_pay" name="net_pay" placeholder="Enter your Net_Pay" value="{{net_pay}}"> <br>
    </div>


    <hr>
    <button type="submit" class="btn " style="box-shadow: 0 0 8px rgb(0, 49, 154) , 0 0 4px #0051ff; color: #041136;background-image: linear-gradient(#b7d7f7 0%, #6f92ccdf);"><i class="bi bi-wallet-fill"></i> Submit</button>
  </form>
</div>
</body>

</html>
