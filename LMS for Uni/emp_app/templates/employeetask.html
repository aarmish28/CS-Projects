{% load static %}
<!doctype html>
<html lang="en">

<head>
  <!-- Required meta tags -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
  <title></title>
  <style>
    body {
      background-image: url("{% static '8.jpg' %}");
      background-repeat: no-repeat;
      background-attachment: fixed;
      background-size: cover;
    }

    .data {
      position: relative;
      display: flex;
      justify-content: right;
      align-items: right;
    }

    input {
      border-radius: 10px;
      padding: 10px;
      margin-top: 15px;
      width: 35%;
      border: none;
      outline: none;
    }

    input:focus {
      border: #ccc;
      transform: scale(1.02);
      box-shadow: 0px 0px 5px rgba(0, 0, 0, 0.2);
    }

    ::placeholder {
      padding-left: 20px;
    }

    input:focus+.placeholder {
      top: -10px;
      color: #04AA6D;
      background-color: #fff;
    }

    label {
      display: flex;
      justify-content: flex-start;
      align-items: center;
      width: 150px;
      font-weight: bolder;
      font-size: 23px;
      color: black;
      padding: 10px 10px 0px 3px;
    }

    form {
      display: flex;
      justify-content: right;
      flex-direction: column;
      margin-top: 50px;
      box-sizing: border-box;
      padding: 20px;

    }

    button {
      width: 230px;
      height: 40px;
      margin: 10px auto;
      margin-right: 100px;
    }
  </style>
</head>
<div class="container mt-3 text-center" style="color: #ffffff">
  <h1
    style="box-shadow: 0 0 8px rgb(255, 255, 255) , 0 0 4px #ffffff; color: #ffffff;background-image: linear-gradient(#636162 0%, #4a4749df);height: 55px;">
    <i class="bi bi-list-task"></i> University Employee Task </h1>


  <hr>
  <form action="/employeetask" method="post" class="form-container">
    {% csrf_token %}
    <div class="data"><label for="name" class="text" style="text-shadow: 0 0 8px rgb(90, 90, 90) , 0 0 4px #696d7d;color: #ffffff;"><b>Name</b></label> <br>
      <input type="text" id="first_name" name="name" placeholder="Enter your First Name" value="{{name}}"> <br>
    </div>



    <div class="data"><label for="description" class="text" style="text-shadow: 0 0 8px rgb(90, 90, 90) , 0 0 4px #696d7d;color: #ffffff;"> <b>Description: </b></label> <br>
      <input id="description" name="description" value="{{description}}" placeholder="Enter Your Description"
        type="text" style="height: 100px;"><br>
    </div>




    <div class="data"><label for="dept" class="text" style="text-shadow: 0 0 8px rgb(90, 90, 90) , 0 0 4px #696d7d;color: #ffffff;"><b>Department:</b></label> <br>
      <input type="number" id="dept" name="dept" placeholder="Enter Your Departement" value="{{dept}}"> <br>
    </div>


    <div class="data"><label for="starttime" class="text" style="text-shadow: 0 0 8px rgb(90, 90, 90) , 0 0 4px #696d7d;color: #ffffff;"><b>Start Time:</b></label> <br>
      <input type="datetime-local" id="starttime" name="start_time" value="{{starttime}}"> <br>
    </div>


    <div class="data"><label for="endtime" class="text" style="text-shadow: 0 0 8px rgb(90, 90, 90) , 0 0 4px #696d7d;color: #ffffff;"><b>End Time:</b></label> <br>
      <input type="datetime-local" id="endtime" name="end_time" value="{{endtime}}"> <br>
    </div>


    <hr>
    <button type="submit" class="btn " style="box-shadow: 0 0 8px rgb(255, 255, 255) , 0 0 4px #dfdfdf; color: #ffffff;background-image: linear-gradient(#404141 0%, #696c71df);"><i class="bi bi-list-task"></i> Submit</button>
  </form>
</div>
</body>

</html>
