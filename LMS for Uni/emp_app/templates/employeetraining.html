{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <title></title>
    <style>
      body {
         background-image: url("{% static '9.jpg' %}");
         background-repeat: no-repeat;
         background-attachment: fixed;
         background-size: cover;
     }
     .data{
      position: relative;
      display: flex;
      justify-content: right;
      align-items: right;
     }
     input{
      border-radius: 10px;
      padding: 10px;
      margin-top: 15px;
      width: 35%;
      border: none;
      outline: none;
     }
     input:focus{
      border: #ccc;
      transform: scale(1.02);
      box-shadow: 0px 0px 5px rgba(0, 0, 0, 0.2);
     }
     ::placeholder{
      padding-left: 20px;
     }
     input:focus + .placeholder
    {
      top: -10px;
      color: #04AA6D;
      background-color: #fff;
    }
    label{
      display: flex;
      justify-content: center;
      align-items: center;
      width: 150px;
      font-weight: bolder;
      font-size: 22px;
      color: black;
      padding: 10px 10px 0px 4px;
      border-radius: 10px;
      margin-right: 20px;
      margin-top: 20px;
    }
  form{
    display: flex;
    justify-content: right;
    flex-direction: column;
    margin-top: 50px;
    box-sizing: border-box;
    padding: 20px;
  
  }
  button{
    width: 230px;
    height: 40px;
    margin: 10px auto;
   margin-right:100px;
  }

     </style>
  </head>
    <div class="container mt-4 text-center" style="color: #fff;"><h1 style="text-shadow: 0 0 4px rgb(4, 4, 255) , 0 0 4px #001aff;background-image: linear-gradient(#9fbfe2 0%, #80add5df);"><i class="bi bi-person-workspace"></i> University Employee Traininng</h1>
  

        <hr>
        <form action="/employeetraining" method="post"  class="form-container" >
          {% csrf_token %}
          <div class="data"><label for="name" class="text" style="text-shadow: 0 0 4px rgb(0, 89, 255) , 0 0 4px #0033ff; color: #fff;background-color: rgba(86, 86, 86, 0.547) ;"><b>Name:</b></label> <br>
        <input type="text" id="first_name" name="name" placeholder="Enter your First Name" value="{{name}}"> <br></div>
        
  
      
        <div class="data"><label for="description" class="text" style="text-shadow: 0 0 4px rgb(4, 92, 255) , 0 0 4px #0033ff; color: #fff;;background-color: rgba(86, 86, 86, 0.547) ;"> <b>Description: </b></label> <br>
        <input id="description" name="description" value="{{description}}" placeholder="Enter Your Description" type="text" style="height: 100px;"><br></div>
  
  
      
    
        <div class="data"><label for="dept" class="text" style="text-shadow: 0 0 4px rgb(4, 92, 255) , 0 0 4px #0033ff; color: #fff;;background-color: rgba(86, 86, 86, 0.547) ;"><b>Department:</b></label> <br>
        <input type="number" id="dept" name="dept" placeholder="Enter Your Departement"value="{{dept}}"> <br></div>
  
  
        <div class="data"><label for="starttime" class="text" style="text-shadow: 0 0 4px rgb(4, 92, 255) , 0 0 4px #0033ff; color: #fff;;background-color: rgba(86, 86, 86, 0.547) ;"><b>Start Time</b></label> <br>
        <input type="datetime-local" id="starttime" name="start_time" value="{{starttime}}"> <br></div>
    
        
        <div class="data"><label for="endtime" class="text" style="text-shadow: 0 0 4px rgb(4, 92, 255) , 0 0 4px #0033ff; color: #fff;;background-color: rgba(86, 86, 86, 0.547) ;"><b>End Time</b></label> <br>
        <input type="datetime-local" id="endtime" name="end_time"  value="{{endtime}}"> <br></div>
    
       
        <hr>
      <button type="submit" class="btn "  style="box-shadow: 0 0 8px rgb(3, 3, 255) , 0 0 4px #1100ff; color: #ffffff;background-image: linear-gradient(#92a6d8 0%, #6e98dbdf);"><i class="bi bi-person-workspace"></i> Submit Now</button>
    </form>
          </div>
        </body>
        </html>
