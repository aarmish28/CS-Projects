<html lang="en">
  <head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <title>University  Employee Management System</title>
    <style>
      body {
         background-image: url(https://images7.alphacoders.com/338/338232.jpg);
         background-repeat: no-repeat;
         background-attachment: fixed;
         background-size: cover;
     }
     </style>
  </head>
  <body>
    <div class="container text-center text-white mt-3">
   <h1  style="box-shadow: 0 0 8px rgb(0, 255, 8) , 0 0 4px #04ff00; color: #0a680c;background-image: linear-gradient(#94bb9d 0%, #b3eabfdf);height: 55px;"><i class="bi bi-book-fill"></i> Books</h1>
   <div class="row  mt-4" style="text-shadow: 0 0 8px rgb(8, 110, 40) , 0 0 4px #14c93e;color: #ffffff;">
    {% for book in books %}
    <div class="col-4 back_img">
    <img src="{{ book.cover.url}}" />
    <div  class="text">
        <h3>{{ book.title}}</h3>
        <p>{{ book.description}}</p>
    </div>
    </div>
    {% endfor %}
   </div>
  
    <!-- Optional JavaScript; choose one of the two! -->

    <!-- Option 1: Bootstrap Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>

    <!-- Option 2: Separate Popper and Bootstrap JS -->
    <!--
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js" integrity="sha384-IQsoLXl5PILFhosVNubq5LC7Qb9DXgDA9i+tQ8Zj3iwWAwPtgFTxbJ8NT4GN1R8p" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.min.js" integrity="sha384-cVKIPhGWiC2Al4u+LWgxfKTRIcfu0JTxR+EQDz/bgldoEyl4H0zUF0QKbrJ0EcQF" crossorigin="anonymous"></script>
    -->
  </body>
</html>
