{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <title>University  Employee Management System</title>
    <style>
        body {
           background-image: url("{% static '4.jpg' %}");
           background-repeat: no-repeat;
           background-attachment: fixed;
           background-size: cover;
       }
       </style>
  </head>
  <body>
    <div class="container mt-4" >
        <h1 class="text-center" style="color: #be005c;background-image: linear-gradient(#f8d1e2 0%, #e4bad6df); height: 55px;box-shadow: 0 0 8px rgb(255, 0, 132) , 0 0 4px #ff007b;"><i class="bi bi-card-checklist"></i> Employee Attendance</h1>

        <table class="table table-danger table-striped" style="box-shadow: 0 0 8px rgb(255, 0, 132) , 0 0 4px #ff007b;">
        <br>

     
          <thead class="text" style="color: #be005c;">
          <tr>
                       <th>Employee</th>
                        <th>Date</th>
                       <th>Enrollment</th>
                </tr>
            </thead>
            <tbody class="text" style="color: #be005c;">
                {% for attendance in attendances %}
                <tr>
                    <td>{{ attendance.employee}}</td>
                    <td>{{ attendance.date }}</td>
                    <td>{{ attendance.status }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>

    <!-- Optional JavaScript; choose one of the two! -->

    <!-- Option 1: Bootstrap Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Option 2: Separate Popper and Bootstrap JS -->
    <!--
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.min.js"></script>
    -->
</body>

</html>
